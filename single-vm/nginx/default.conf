# Docker internal DNS — resolves container names at request time, not startup
resolver 127.0.0.11 valid=10s ipv6=off;

# Single entry point on port 3000 — the only port most client firewalls
# will open. web, phish (landing page), user and lms all get published to
# the host only through here.

server {
    listen 3000 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gophish landing page, served under a path prefix so it shares this
    # port with the web app when only a raw IP (no DNS) is available.
    # Gophish's own router registers path-prefixed track/report routes
    # (see gophish/controllers/phish.go) specifically to support this —
    # proxy the path through unchanged, no rewrite/strip needed.
    location /landing/ {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Gophish credential-capture endpoint script — only registered at
    # root by gophish (no path-prefixed variant), so it needs its own
    # passthrough alongside /landing/.
    location /static/ {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        set $upstream http://cyberwise-web:3000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Production/DNS scenario: once the client hands over a real domain, point
# a subdomain (e.g. landing.<client-domain>) at this same IP and swap
# server_name below — the landing page then gets the whole host, no path
# prefix needed, and NEXT_PUBLIC_LANDING_PAGE_URL becomes
# https://landing.<client-domain>:3000. Still the same port, no new
# firewall request.
server {
    listen 3000 ssl;
    server_name landing.CHANGE_ME;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        set $upstream http://cyberwise-phish:8080;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

