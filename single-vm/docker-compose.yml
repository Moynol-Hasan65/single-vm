services:
  mysql:
    image: mysql:8.3
    container_name: cyberwise-mysql
    restart: unless-stopped
    env_file: .env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: cyberwise-minio
    restart: unless-stopped
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: cyberwise-nginx
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user
      - lms
      - web
      - phish

  user:
    image: ${USER_IMAGE}
    container_name: cyberwise-user
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "10081:8080"
      - "10091:8090"

  lms:
    image: ${LMS_IMAGE}
    container_name: cyberwise-lms
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "10082:9090"

  web:
    image: ${WEB_IMAGE}
    container_name: cyberwise-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy

  phish:
    image: ${PHISH_IMAGE}
    container_name: cyberwise-phish
    restart: unless-stopped
    environment:
      GOPHISH_INITIAL_ADMIN_API_TOKEN: ${GO_PHISH_TOKEN}
      GOPHISH_INITIAL_ADMIN_PASSWORD: ${GOPHISH_ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./phish/config.json:/opt/gophish/config.json:ro

volumes:
  mysql-data:
  minio-data:

networks:
  default:
    driver: bridge
